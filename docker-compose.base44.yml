services:
  web:
    image: node:20.19.0
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    command: ["sh", "-ec", "corepack enable && corepack prepare pnpm@10.17.1 --activate && pnpm install --frozen-lockfile && exec pnpm dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)throw new Error('bad status '+r.status)}).catch(e=>{throw e})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
