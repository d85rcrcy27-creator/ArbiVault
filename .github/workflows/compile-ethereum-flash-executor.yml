name: Ethereum Flash Executor Solidity CI

on:
  push:
    paths:
      - "contracts/ArbiVaultEthereumFlashExecutor.sol"
      - "test/ArbiVaultEthereumFlashExecutor.t.sol"
      - "foundry.toml"
      - ".github/workflows/compile-ethereum-flash-executor.yml"
  pull_request:
    paths:
      - "contracts/ArbiVaultEthereumFlashExecutor.sol"
      - "foundry.toml"
      - ".github/workflows/compile-ethereum-flash-executor.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Compile Ethereum executor
        run: forge build --sizes
      - name: Run Ethereum executor safety tests
        run: forge test --match-path test/ArbiVaultEthereumFlashExecutor.t.sol -vv
