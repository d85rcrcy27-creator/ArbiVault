name: Flash Executor Solidity CI

on:
  push:
    paths:
      - "contracts/ArbiVaultFlashExecutor.sol"
      - "contracts/ArbiVaultEthereumFlashExecutor.sol"
      - "test/ArbiVaultFlashExecutor.t.sol"
      - "test/ArbiVaultEthereumFlashExecutor.t.sol"
      - "foundry.toml"
      - ".github/workflows/flash-executor-ci.yml"
  pull_request:
    paths:
      - "contracts/ArbiVaultFlashExecutor.sol"
      - "contracts/ArbiVaultEthereumFlashExecutor.sol"
      - "test/ArbiVaultFlashExecutor.t.sol"
      - "test/ArbiVaultEthereumFlashExecutor.t.sol"
      - "foundry.toml"
      - ".github/workflows/flash-executor-ci.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Compile both chain executors
        run: forge build --sizes
      - name: Test BNB flash executor
        run: forge test --match-path test/ArbiVaultFlashExecutor.t.sol -vv
      - name: Test Ethereum flash executor
        run: forge test --match-path test/ArbiVaultEthereumFlashExecutor.t.sol -vv
