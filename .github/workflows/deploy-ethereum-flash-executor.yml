name: Deploy ArbiVault Ethereum Flash Executor (Supabase Vault Signer)

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet:
        description: Type DEPLOY_TO_ETHEREUM_MAINNET to deploy the executor to Ethereum mainnet
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_mainnet == 'DEPLOY_TO_ETHEREUM_MAINNET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      DEPLOY_URL: "https://karbtrfzxfyipxkhhqjz.supabase.co/functions/v1/arbivault-executor-deployer"
      CHAIN: "ethereum"
      CONFIRM_PHRASE: "DEPLOY_TO_ETHEREUM_MAINNET"
      AAVE_POOL: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile, test, and pin executor source
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          forge build --sizes
          forge test --match-path test/ArbiVaultEthereumFlashExecutor.t.sol -vv
          source_sha="$(git rev-parse HEAD:contracts/ArbiVaultEthereumFlashExecutor.sol)"
          expected_sha="4f260f58ffe7201cc478db7752f4622d8df571ac"
          if [[ "$source_sha" != "$expected_sha" ]]; then
            echo "::error::Executor source revision is not the reviewed, allowlisted source."
            exit 1
          fi
          artifact_path="$(find out -type f -name 'ArbiVaultEthereumFlashExecutor.json' -print -quit)"
          if [[ -z "$artifact_path" ]]; then
            echo "::error::Foundry artifact ArbiVaultEthereumFlashExecutor.json was not found under out/."
            exit 1
          fi
          if ! bytecode="$(jq -er '.bytecode.object | select(type == "string" and length > 0)' "$artifact_path" 2>/dev/null)"; then
            echo "::error::Foundry artifact at $artifact_path has no creation bytecode object."
            exit 1
          fi
          bytecode="${bytecode#0x}"
          if [[ -z "$bytecode" || ! "$bytecode" =~ ^[0-9a-fA-F]+$ ]]; then
            echo "::error::Foundry did not emit valid creation bytecode."
            exit 1
          fi
          echo "contract_source_blob_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "creation_bytecode=0x$bytecode" >> "$GITHUB_OUTPUT"

      - name: Validate chain, protocol bytecode, signer balance and gas
        id: preflight
        shell: bash
        env:
          SOURCE_BLOB_SHA: ${{ steps.compile.outputs.contract_source_blob_sha }}
          CREATION_BYTECODE: ${{ steps.compile.outputs.creation_bytecode }}
        run: |
          set -euo pipefail
          if [[ -z "$RPC_URL" ]]; then RPC_URL="https://ethereum-rpc.publicnode.com"; fi
          chain_id="$(cast chain-id --rpc-url "$RPC_URL")"
          if [[ "$chain_id" != "1" ]]; then
            echo "::error::Wrong chain id: $chain_id"
            exit 1
          fi
          for address in "$AAVE_POOL" 0x7a250d5630B4cf539739dF2C5dAcb4c659F2488D 0xd9e1cE17f2641f24aE83637ab66a2cca9C378B9F 0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2 0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48; do
            address_code="$(cast code "$address" --rpc-url "$RPC_URL")"
            if [[ -z "$address_code" || "$address_code" == "0x" ]]; then
              echo "::error::Required protocol/token bytecode missing at $address"
              exit 1
            fi
          done
          get_oidc_token() {
            local separator="?"
            case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator="&";; esac
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL$separator"audience=arbivault-executor-deployer | jq -er '.value'
          }
          payload="$(jq -cn --arg mode "preflight" --arg chain "$CHAIN" --arg phrase "$CONFIRM_PHRASE" --arg sha "$SOURCE_BLOB_SHA" --arg bytecode "$CREATION_BYTECODE" '{mode:$mode,chain:$chain,confirm_phrase:$phrase,contract_source_blob_sha:$sha,creation_bytecode:$bytecode}')"
          token="$(get_oidc_token)"
          status="$(curl -sS -o "$RUNNER_TEMP/preflight.json" -w '%{http_code}' -X POST "$DEPLOY_URL" -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$payload")"
          cat "$RUNNER_TEMP/preflight.json"
          if [[ "$status" != "200" ]] || [[ "$(jq -r '.ok // false' "$RUNNER_TEMP/preflight.json")" != "true" ]]; then
            echo "::error::Supabase deployment preflight failed; no transaction was broadcast."
            exit 1
          fi
          deployer="$(jq -er '.deployer_address' "$RUNNER_TEMP/preflight.json")"
          hot_wallet="$(jq -er '.hot_wallet | select(test("^0x[0-9a-fA-F]{40}$"))' "$RUNNER_TEMP/preflight.json")"
          profit_recipient="$(jq -er '.profit_recipient | select(test("^0x[0-9a-fA-F]{40}$"))' "$RUNNER_TEMP/preflight.json")"
          deployer_lower="$(printf '%s' "$deployer" | tr '[:upper:]' '[:lower:]')"
          hot_wallet_lower="$(printf '%s' "$hot_wallet" | tr '[:upper:]' '[:lower:]')"
          profit_recipient_lower="$(printf '%s' "$profit_recipient" | tr '[:upper:]' '[:lower:]')"
          if [[ "$hot_wallet_lower" == "$profit_recipient_lower" ]]; then
            echo "::error::Trading and profit-recipient wallets must be separate."
            exit 1
          fi
          if [[ "$deployer_lower" == "$hot_wallet_lower" || "$deployer_lower" == "$profit_recipient_lower" ]]; then
            echo "::error::Deployment signer cannot equal the trading or profit-recipient wallet."
            exit 1
          fi
          echo "HOT_WALLET=$hot_wallet" >> "$GITHUB_ENV"
          echo "PROFIT_RECIPIENT=$profit_recipient" >> "$GITHUB_ENV"

      - name: Deploy with restricted Supabase Vault signer
        id: deploy
        shell: bash
        env:
          SOURCE_BLOB_SHA: ${{ steps.compile.outputs.contract_source_blob_sha }}
          CREATION_BYTECODE: ${{ steps.compile.outputs.creation_bytecode }}
        run: |
          set -euo pipefail
          get_oidc_token() {
            local separator="?"
            case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator="&";; esac
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL$separator"audience=arbivault-executor-deployer | jq -er '.value'
          }
          payload="$(jq -cn --arg mode "deploy" --arg chain "$CHAIN" --arg phrase "$CONFIRM_PHRASE" --arg sha "$SOURCE_BLOB_SHA" --arg bytecode "$CREATION_BYTECODE" '{mode:$mode,chain:$chain,confirm_phrase:$phrase,contract_source_blob_sha:$sha,creation_bytecode:$bytecode}')"
          token="$(get_oidc_token)"
          status="$(curl -sS -o "$RUNNER_TEMP/deploy.json" -w '%{http_code}' -X POST "$DEPLOY_URL" -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$payload")"
          cat "$RUNNER_TEMP/deploy.json"
          if [[ "$status" != "200" ]] || [[ "$(jq -r '.confirmed // false' "$RUNNER_TEMP/deploy.json")" != "true" ]]; then
            echo "::error::Deployment was not confirmed. Do not resubmit; reconcile the transaction hash first."
            exit 1
          fi
          echo "contract_address=$(jq -er '.executor_address' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"
          echo "transaction_hash=$(jq -er '.deployment_tx_hash' "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"

      - name: Independently verify bytecode and immutable payout configuration
        env:
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.contract_address }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RPC_URL" ]]; then RPC_URL="https://ethereum-rpc.publicnode.com"; fi
          deployed_code="$(cast code "$CONTRACT_ADDRESS" --rpc-url "$RPC_URL")"
          if [[ -z "$deployed_code" || "$deployed_code" == "0x" ]]; then
            echo "::error::No runtime bytecode at deployed address"
            exit 1
          fi
          payout="$(cast call "$CONTRACT_ADDRESS" 'HOT_WALLET()(address)' --rpc-url "$RPC_URL" | tr '[:upper:]' '[:lower:]')"
          expected_payout="$(printf '%s' "$HOT_WALLET" | tr '[:upper:]' '[:lower:]')"
          profit_payout="$(cast call "$CONTRACT_ADDRESS" 'PROFIT_RECIPIENT()(address)' --rpc-url "$RPC_URL" | tr '[:upper:]' '[:lower:]')"
          expected_profit_payout="$(printf '%s' "$PROFIT_RECIPIENT" | tr '[:upper:]' '[:lower:]')"
          pool="$(cast call "$CONTRACT_ADDRESS" 'POOL()(address)' --rpc-url "$RPC_URL" | tr '[:upper:]' '[:lower:]')"
          expected_pool="$(printf '%s' "$AAVE_POOL" | tr '[:upper:]' '[:lower:]')"
          if [[ "$payout" != "$expected_payout" || "$profit_payout" != "$expected_profit_payout" || "$pool" != "$expected_pool" || "$payout" == "$profit_payout" ]]; then
            echo "::error::Immutable HOT_WALLET, PROFIT_RECIPIENT or POOL getter mismatch"
            exit 1
          fi

      - name: Submit exact source verification
        continue-on-error: true
        env:
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.contract_address }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RPC_URL" ]]; then RPC_URL="https://ethereum-rpc.publicnode.com"; fi
          constructor_args="$(cast abi-encode 'constructor(address,address,address)' "$AAVE_POOL" "$HOT_WALLET" "$PROFIT_RECIPIENT")"
          forge verify-contract --chain-id 1 --verifier sourcify --constructor-args "$constructor_args" "$CONTRACT_ADDRESS" contracts/ArbiVaultEthereumFlashExecutor.sol:ArbiVaultEthereumFlashExecutor

      - name: Require exact source/runtime match and record payout audit
        shell: bash
        run: |
          set -euo pipefail
          get_oidc_token() {
            local separator="?"
            case "$ACTIONS_ID_TOKEN_REQUEST_URL" in *\?*) separator="&";; esac
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL$separator"audience=arbivault-executor-deployer | jq -er '.value'
          }
          verified=false
          for attempt in $(seq 1 8); do
            payload="$(jq -cn --arg mode "verify" --arg chain "$CHAIN" --arg phrase "$CONFIRM_PHRASE" '{mode:$mode,chain:$chain,confirm_phrase:$phrase}')"
            token="$(get_oidc_token)"
            status="$(curl -sS -o "$RUNNER_TEMP/verify.json" -w '%{http_code}' -X POST "$DEPLOY_URL" -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d "$payload")"
            cat "$RUNNER_TEMP/verify.json"
            if [[ "$(jq -r '.payout_audited // false' "$RUNNER_TEMP/verify.json")" == "true" ]]; then verified=true; break; fi
            sleep 5
          done
          if [[ "$verified" != "true" ]]; then
            echo "::error::Exact source/runtime verification not yet confirmed; execution remains fail-closed."
            exit 1
          fi
          {
            echo "## ArbiVault Flash Executor Deployment"
            echo "Network chain id: 1"
            echo "Contract: $(jq -r '.executor_address' "$RUNNER_TEMP/verify.json")"
            echo "Deployment transaction: $(jq -r '.deployment_tx_hash' "$RUNNER_TEMP/verify.json")"
            echo "Immutable HOT_WALLET: $(jq -r '.hot_wallet' "$RUNNER_TEMP/verify.json")"
            echo "Immutable PROFIT_RECIPIENT: $(jq -r '.profit_recipient' "$RUNNER_TEMP/verify.json")"
            echo "Immutable POOL: $(jq -r '.pool' "$RUNNER_TEMP/verify.json")"
            echo "Exact source/runtime verification: passed"
            echo "Payout configuration audit: passed"
            echo "Payout behavior balance-delta proof: still required"
          } >> "$GITHUB_STEP_SUMMARY"
