name: Deploy ArbiVault Ethereum Flash Executor

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet:
        description: Type DEPLOY_TO_ETHEREUM_MAINNET to deploy the executor to Ethereum mainnet
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_mainnet == 'DEPLOY_TO_ETHEREUM_MAINNET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      ETHEREUM_DEPLOYER_PRIVATE_KEY: ${{ secrets.ETHEREUM_DEPLOYER_PRIVATE_KEY }}
      ETHEREUM_HOT_WALLET: ${{ secrets.ETHEREUM_HOT_WALLET }}
      AAVE_POOL: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fa4E2"
      UNISWAP_V2_ROUTER: "0x7a250d5630B4cf539739dF2C5dAcb4c659F2488D"
      SUSHISWAP_V2_ROUTER: "0xd9e1cE17f2641f24aE83637ab66a2cca9C378B9F"
      WETH: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
      USDC: "0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile and test executor
        run: |
          set -euo pipefail
          forge build --sizes
          forge test --match-path test/ArbiVaultEthereumFlashExecutor.t.sol -vv

      - name: Validate Ethereum mainnet, deployment signer, and protocol contracts
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ETHEREUM_DEPLOYER_PRIVATE_KEY" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Repository secret ETHEREUM_DEPLOYER_PRIVATE_KEY is missing or malformed. Store a dedicated, funded deployment key in GitHub Secrets; never place a key in source code."
            exit 1
          fi
          if [[ ! "$ETHEREUM_HOT_WALLET" =~ ^0x[0-9a-fA-F]{40}$ || "$ETHEREUM_HOT_WALLET" =~ ^0x0{40}$ ]]; then
            echo "::error::Repository secret ETHEREUM_HOT_WALLET is missing or invalid. It must be the intended ArbiVault Ethereum trading hot wallet."
            exit 1
          fi
          if [[ -z "$ETHEREUM_RPC_URL" ]]; then
            ETHEREUM_RPC_URL="https://ethereum-rpc.publicnode.com"
            echo "ETHEREUM_RPC_URL=$ETHEREUM_RPC_URL" >> "$GITHUB_ENV"
          fi
          chain_id="$(cast chain-id --rpc-url "$ETHEREUM_RPC_URL")"
          if [[ "$chain_id" != "1" ]]; then
            echo "::error::Refusing deployment: RPC chain id is $chain_id, expected Ethereum mainnet 1."
            exit 1
          fi
          deployer="$(cast wallet address --private-key "$ETHEREUM_DEPLOYER_PRIVATE_KEY")"
          balance_wei="$(cast balance "$deployer" --rpc-url "$ETHEREUM_RPC_URL")"
          if [[ ! "$balance_wei" =~ ^[0-9]+$ || "$balance_wei" == "0" ]]; then
            echo "::error::Deployment signer has no ETH for deployment gas."
            exit 1
          fi
          for address in "$AAVE_POOL" "$UNISWAP_V2_ROUTER" "$SUSHISWAP_V2_ROUTER" "$WETH" "$USDC"; do
            code="$(cast code "$address" --rpc-url "$ETHEREUM_RPC_URL")"
            if [[ -z "$code" || "$code" == "0x" ]]; then
              echo "::error::Expected Ethereum protocol/token contract has no code at $address. Refusing deployment."
              exit 1
            fi
          done
          printf '%s\n' "Verified chain id: $chain_id" "Deployment signer: $deployer" "Deployment signer native balance (wei): $balance_wei" "Intended hot-wallet payout: $ETHEREUM_HOT_WALLET"
          echo "deployer=$deployer" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify immutable payout configuration
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_file="$RUNNER_TEMP/arbivault-ethereum-flash-deployment.json"
          forge create --json --broadcast \
            --rpc-url "$ETHEREUM_RPC_URL" \
            --private-key "$ETHEREUM_DEPLOYER_PRIVATE_KEY" \
            --constructor-args "$AAVE_POOL" "$ETHEREUM_HOT_WALLET" \
            contracts/ArbiVaultEthereumFlashExecutor.sol:ArbiVaultEthereumFlashExecutor \
            > "$deployment_file"

          address="$(jq -r '.deployedTo // empty' "$deployment_file")"
          tx_hash="$(jq -r '.transactionHash // empty' "$deployment_file")"
          if [[ ! "$address" =~ ^0x[0-9a-fA-F]{40}$ || ! "$tx_hash" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Forge did not return a valid deployed contract address and transaction hash."
            exit 1
          fi

          code="$(cast code "$address" --rpc-url "$ETHEREUM_RPC_URL")"
          if [[ -z "$code" || "$code" == "0x" ]]; then
            echo "::error::No deployed contract bytecode found at $address."
            exit 1
          fi
          payout="$(cast call "$address" 'HOT_WALLET()(address)' --rpc-url "$ETHEREUM_RPC_URL" | tr '[:upper:]' '[:lower:]')"
          expected_payout="$(printf '%s' "$ETHEREUM_HOT_WALLET" | tr '[:upper:]' '[:lower:]')"
          pool="$(cast call "$address" 'POOL()(address)' --rpc-url "$ETHEREUM_RPC_URL" | tr '[:upper:]' '[:lower:]')"
          expected_pool="$(printf '%s' "$AAVE_POOL" | tr '[:upper:]' '[:lower:]')"
          if [[ "$payout" != "$expected_payout" || "$pool" != "$expected_pool" ]]; then
            echo "::error::Immutable payout or Aave pool getter does not match the intended configuration."
            exit 1
          fi

          echo "contract_address=$address" >> "$GITHUB_OUTPUT"
          echo "transaction_hash=$tx_hash" >> "$GITHUB_OUTPUT"
          echo "bytecode_bytes=$(( (${#code} - 2) / 2 ))" >> "$GITHUB_OUTPUT"
          {
            echo "## ArbiVault Ethereum flash executor deployment"
            echo
            echo "- Network: Ethereum mainnet (chain id 1)"
            echo "- Contract: `$address`"
            echo "- Deployment transaction: `$tx_hash`"
            echo "- Immutable HOT_WALLET getter: `$payout`"
            echo "- Immutable POOL getter: `$pool`"
            echo "- Deployed bytecode bytes: $(( (${#code} - 2) / 2 ))"
            echo
            echo "**Not yet live for trading:** add the verified address to Supabase secret `ARBIVAULT_ETH_FLASH_EXECUTOR`, verify source/runtime bytecode, compare `HOT_WALLET()` to the active ArbiVault generated wallet, and only then consider `ARBIVAULT_ETH_FLASH_EXECUTOR_PAYOUT_AUDITED=true`. Do not mark payout audited based on deployment alone."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attempt Sourcify source verification
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          constructor_args="$(cast abi-encode 'constructor(address,address)' "$AAVE_POOL" "$ETHEREUM_HOT_WALLET")"
          forge verify-contract \
            --chain-id 1 \
            --verifier sourcify \
            --constructor-args "$constructor_args" \
            "${{ steps.deploy.outputs.contract_address }}" \
            contracts/ArbiVaultEthereumFlashExecutor.sol:ArbiVaultEthereumFlashExecutor

      - name: Report post-deployment gates
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "Deployment is not a payout audit or live-trading authorization. Confirm exact runtime/source match and signer payout route; transaction simulation and a bounded explicit test remain separate gates."
          } >> "$GITHUB_STEP_SUMMARY"
