name: Deploy ArbiVault BNB Flash Executor

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet:
        description: Type DEPLOY_TO_BSC_MAINNET to deploy the executor to BNB Smart Chain mainnet
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_mainnet == 'DEPLOY_TO_BSC_MAINNET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
      BSC_DEPLOYER_PRIVATE_KEY: ${{ secrets.BSC_DEPLOYER_PRIVATE_KEY }}
      HOT_WALLET: "0xEa37838f3361b80601756f7B0D770A5F5f38c486"
      AAVE_POOL: "0x6807dc923806fE8Fd134338EABCA509979a7e0cB"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile executor
        run: forge build --sizes

      - name: Validate mainnet configuration and deployer funding
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BSC_DEPLOYER_PRIVATE_KEY" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Repository secret BSC_DEPLOYER_PRIVATE_KEY is missing or malformed. It must be a funded deployer key stored in GitHub Secrets, never in source code."
            exit 1
          fi
          if [[ -z "$BSC_RPC_URL" ]]; then
            BSC_RPC_URL="https://bsc-dataseed.binance.org"
            echo "BSC_RPC_URL=$BSC_RPC_URL" >> "$GITHUB_ENV"
          fi
          chain_id="$(cast chain-id --rpc-url "$BSC_RPC_URL")"
          if [[ "$chain_id" != "56" ]]; then
            echo "::error::Refusing deployment: RPC chain id is $chain_id, expected BNB Smart Chain mainnet 56."
            exit 1
          fi
          deployer="$(cast wallet address --private-key "$BSC_DEPLOYER_PRIVATE_KEY")"
          balance_wei="$(cast balance "$deployer" --rpc-url "$BSC_RPC_URL")"
          if [[ ! "$balance_wei" =~ ^[0-9]+$ || "$balance_wei" == "0" ]]; then
            echo "::error::The deployment wallet has no BNB for gas. Fund the deployer wallet before retrying."
            exit 1
          fi
          echo "Verified BNB Smart Chain chain id: $chain_id"
          echo "Deployer address: $deployer"
          echo "Deployer native balance (wei): $balance_wei"
          echo "Expected payout wallet: $HOT_WALLET"
          echo "deployer=$deployer" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify bytecode and immutable payout wallet
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_file="$RUNNER_TEMP/arbivault-flash-deployment.json"
          forge create --json --broadcast \
            --rpc-url "$BSC_RPC_URL" \
            --private-key "$BSC_DEPLOYER_PRIVATE_KEY" \
            --constructor-args "$AAVE_POOL" "$HOT_WALLET" \
            contracts/ArbiVaultFlashExecutor.sol:ArbiVaultFlashExecutor \
            > "$deployment_file"

          address="$(jq -r '.deployedTo // empty' "$deployment_file")"
          tx_hash="$(jq -r '.transactionHash // empty' "$deployment_file")"
          if [[ ! "$address" =~ ^0x[0-9a-fA-F]{40}$ || ! "$tx_hash" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Forge did not return a valid deployed contract address and transaction hash."
            cat "$deployment_file"
            exit 1
          fi

          code="$(cast code "$address" --rpc-url "$BSC_RPC_URL")"
          if [[ -z "$code" || "$code" == "0x" ]]; then
            echo "::error::No contract bytecode found at $address after deployment."
            exit 1
          fi
          payout="$(cast call "$address" 'HOT_WALLET()(address)' --rpc-url "$BSC_RPC_URL" | tr '[:upper:]' '[:lower:]')"
          expected_payout="$(printf '%s' "$HOT_WALLET" | tr '[:upper:]' '[:lower:]')"
          if [[ "$payout" != "$expected_payout" ]]; then
            echo "::error::Immutable payout wallet mismatch: got $payout, expected $expected_payout."
            exit 1
          fi

          echo "contract_address=$address" >> "$GITHUB_OUTPUT"
          echo "transaction_hash=$tx_hash" >> "$GITHUB_OUTPUT"
          echo "bytecode_bytes=$(( (${#code} - 2) / 2 ))" >> "$GITHUB_OUTPUT"

          {
            echo "## ArbiVault BNB flash executor deployment"
            echo
            echo "- Network: BNB Smart Chain mainnet (chain id 56)"
            echo "- Contract: \`$address\`"
            echo "- Deployment transaction: \`$tx_hash\`"
            echo "- Immutable HOT_WALLET: \`$payout\`"
            echo "- Deployed bytecode bytes: $(( (${#code} - 2) / 2 ))"
            echo
            echo "**Follow-up required:** configure the verified executor address in Supabase Edge Function secrets. Do not set \`ARBIVAULT_FLASH_EXECUTOR_PAYOUT_AUDITED=true\` until source verification and payout checks have passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attempt Sourcify source verification
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          constructor_args="$(cast abi-encode 'constructor(address,address)' "$AAVE_POOL" "$HOT_WALLET")"
          forge verify-contract \
            --chain-id 56 \
            --verifier sourcify \
            --constructor-args "$constructor_args" \
            "${{ steps.deploy.outputs.contract_address }}" \
            contracts/ArbiVaultFlashExecutor.sol:ArbiVaultFlashExecutor

      - name: Report verification status
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "Source verification may complete asynchronously. Confirm the contract on Sourcify/Blockscout and then run ArbiVault's executor diagnostic. Deployment alone does not authorize flash execution."
          } >> "$GITHUB_STEP_SUMMARY"
