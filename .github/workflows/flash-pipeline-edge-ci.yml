name: ArbiVault Flash Pipeline Edge Function CI

on:
  push:
    paths:
      - "supabase/functions/arbivault-transaction-builder/index.ts"
      - "supabase/functions/arbivault-flash-loan-strategy/index.ts"
      - "supabase/functions/arbivault-signer/index.ts"
      - "supabase/functions/arbivault-jupiter-flashloan/index.ts"
      - "supabase/functions/arbivault-executor-deployer/index.ts"
      - "supabase/functions/arbivault-executor-audit/index.ts"
      - "supabase/functions/arbivault-wallet-bootstrap/index.ts"
      - ".github/workflows/flash-pipeline-edge-ci.yml"
  pull_request:
    paths:
      - "supabase/functions/arbivault-transaction-builder/index.ts"
      - "supabase/functions/arbivault-flash-loan-strategy/index.ts"
      - "supabase/functions/arbivault-signer/index.ts"
      - "supabase/functions/arbivault-jupiter-flashloan/index.ts"
      - "supabase/functions/arbivault-executor-deployer/index.ts"
      - "supabase/functions/arbivault-executor-audit/index.ts"
      - "supabase/functions/arbivault-wallet-bootstrap/index.ts"
      - ".github/workflows/flash-pipeline-edge-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check builder
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/arbivault-transaction-builder/index.ts
      - name: Type-check strategy worker
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/arbivault-flash-loan-strategy/index.ts
      - name: Type-check signer
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/arbivault-signer/index.ts
      - name: Type-check Jupiter flashloan preflight
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/arbivault-jupiter-flashloan/index.ts
      - name: Type-check executor deployer
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/arbivault-executor-deployer/index.ts
      - name: Type-check executor audit
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/arbivault-executor-audit/index.ts
      - name: Type-check wallet bootstrap
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/arbivault-wallet-bootstrap/index.ts
