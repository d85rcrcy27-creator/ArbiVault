name: Sync maintenance dependency lockfile

on:
  push:
    branches: ["chore/upgrade-vite-8-3-4"]
    paths:
      - "package.json"
      - ".github/workflows/refresh-maintenance-lockfile.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/refresh-maintenance-lockfile.yml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: "10.34.0"
          run_install: false
      - name: Regenerate lockfile without running package scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile on maintenance branch only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): sync maintenance dependencies"
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git fetch origin "$target_branch"
          git rebase "origin/$target_branch"
          git push origin "HEAD:$target_branch"
